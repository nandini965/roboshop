 version: "3.8"

 services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    networks:
      - app-network


  cart:
    build: ./cart
    environment:
      redisHost: redis
      catalogueHost: catalogue
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      catalogue:
        condition: service_healthy

# Use root/example as user/password credentials
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: roboshop
      MONGO_INITDB_ROOT_PASSWORD: roboshop123456

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    networks:
      - app-network
    ports:
      - "6379:6379"  # Expose Redis port
    healthcheck:
        test: [ "CMD", "redis-cli", "ping" ]
        interval: 10s
        timeout: 5s
        retries: 5

  user:
    build: ./user
    container_name: user
    environment:

    depends_on:
      - mongo
      - redis
    networks:
      - app-network
    ports:
      - "8080:80"  # Expose your user-service on port 8080
    volumes:
      - .:/app  # Mount current directory to the container (for development)

  payment:
    build: ./payment
    ports:
      - "8080:8080"
    environment:
      AMQP_HOST: rabbitmq
      AMQP_USER: guest
      AMQP_PASS: guest
    networks:
      - app-network


  shipping:
    build: ./shipping
    ports:
      - "8080:8080"
    environment:
      AMQP_HOST: mysql
      AMQP_USER: guest
      AMQP_PASS: guest
    networks:
      - app-network


  rabbitmq:
    image: rabbitmq:management
    restart: always
    environment:
      AMQP_USER: guest
      AMQP_PASS: guest
    ports:
      - "5672:5672"  # Default AMQP port
      - "15672:15672"  # RabbitMQ management console
    networks:
      - app-network

  catalogue:
    build: ./catalogue
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: roboshop
      ME_CONFIG_MONGODB_ADMINPASSWORD: roboshop123456
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/catalogue
      ME_CONFIG_BASICAUTH: false

    ports:
      - "8080:8080"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
     # mongo:
      #  condition: service_healthy
      redis:
        condition: service_healthy


  mysql:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: roboshop123456
      MYSQL_USER: roboshop
      MYSQL_PASSWORD: roboshop123456
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
   mongo-data:  # Persistent volume for MongoDB data


